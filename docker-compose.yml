version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Must be build args, not just runtime environment: output:standalone
      # bakes NEXT_PUBLIC_* into the build (including next.config.mjs's
      # /api/* rewrite destination — resolved once at build time for a
      # standalone server, not per request), so setting these only below
      # in `environment:` is too late. Verified directly: without this,
      # the container starts fine but every /api/* request 500s because
      # the rewrite destination froze as "undefined" during the build.
      args:
        NEXT_PUBLIC_API_URL: http://backend:8000
        NEXT_PUBLIC_ENABLE_STIR: "true"
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NEXT_PUBLIC_ENABLE_STIR=true
    depends_on:
      - backend
    restart: unless-stopped
